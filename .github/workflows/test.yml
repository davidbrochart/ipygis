name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install JupyterLab build tools
        run: python -m pip install 'jupyterlab>=4,<5'

      - name: Install JavaScript dependencies
        run: jlpm install --immutable

      - name: Run JavaScript tests
        run: jlpm test

      - name: Build and install ipygis with test dependencies
        run: python -m pip install '.[test]'

      - name: Lint Python
        run: python -m ruff check ipygis tests

      - name: Check Python formatting
        run: python -m ruff format --check ipygis tests

      - name: Run Python tests
        run: python -m pytest tests -v
